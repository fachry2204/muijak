version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mui_jakarta_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=muisecret!
      - DB_NAME=mui_jakarta
      - DB_PORT=3306
      - JWT_SECRET=supersecretkey_mui_jakarta_2026_!@#
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: mui_jakarta_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=muisecret!
      - MYSQL_DATABASE=mui_jakarta
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/database-schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
